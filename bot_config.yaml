# sloperator config (--config_file). Every key is optional; defaults shown.

# In-process models (sherpa-onnx); paths as baked into the container image.
# Remove a line to use the Wyoming service below instead.
stt_model: /models/moonshine       # or a Parakeet TDT dir (more accurate, ~650 MB)
tts_model: /models/piper           # or a Kokoro dir (more natural, ~5x slower)
# tts_speed: 1.0
# tts_speaker: 0                   # voice id for multi-voice models (Kokoro)
# threads: 4                       # per in-process model; = physical cores

# whisper: whisper:10300           # Wyoming STT (if no stt_model)
# ollama:  http://ollama:11434
# piper:   piper:10200             # Wyoming TTS (if no tts_model)
# pbx:     ""                      # SIP host for transfers
model: qwen3:4b-instruct
# language: en                     # sent to Whisper; skips language detection
# think: false                     # top-level Ollama "think"; omit for non-thinking models
# max_calls: 1                     # one CPU can't serve parallel calls well
# history_turns: 8                 # turns of history sent to the LLM
# tts_rms: 4000                    # speech loudness (~-18 dBFS)

greeting: Hello, Example Co, how can I help you?
# fallback: Sorry, I'm having trouble right now. Please try again in a moment.  # LLM down

system_prompt: |
  You are the phone receptionist for Example Co.
  Reply in one to three short, plain spoken sentences. No lists or markdown.
  If you don't know something, say so and offer a transfer.

# Facts the bot may state; it is told never to invent others.
knowledge: |
  Open 9 to 5, Monday to Friday. 12 Main Street.

# Exposed as the transfer_call tool; names are what callers ask for.
directory:
  sales: 1042
  support: 1050

vad:
  model: /models/silero_vad.onnx   # neural VAD; remove for the energy VAD
  # prob: 0.5                      # Silero speech probability threshold
  # threshold: 500                 # energy VAD: RMS of a voiced frame
  # silence_ms: 600                # trailing silence that ends a turn
  # min_speech_ms: 200

# Forwarded verbatim to Ollama "options" (merged over these defaults).
options:
  temperature: 0.3
  top_p: 0.8
  top_k: 20
  num_ctx: 4096
  # num_thread: 4                  # = physical cores
